name: Sync from Google Drive
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Install dependencies
        run: pip install google-auth google-api-python-client
      - name: Sync source documents
        env:
          GOOGLE_DOC_ID: ${{ vars.GOOGLE_DOC_ID || '10urKQXlpjne33hfY7R_MbwpwKkeesQXQsIpwDn-e_c0' }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || '1cfTCAXQ2Bu_j1yn_7BkroMqfxlCzwGO2Rn_wvp6uWrQ' }}
        run: python scripts/sync_drive.py
      - name: Summarize source changes
        run: python scripts/review_summary.py
      - name: Propose verified changes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync evidence from Google Drive"
          branch: automation/google-drive-sync
          delete-branch: true
          title: "Update evidence textbook and literature database"
          body-path: REVIEW_SUMMARY.md
          add-paths: |
            textbook/
            literature/
